version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incubrix-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - STORAGE_TYPE=local
      - STORAGE_PATH=/app/data/storage
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=incubrix
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - TRANSCRIPTION_PROVIDER=mock
      - LLM_PROVIDER=mock
      - TIME_POLICY=current
      - DEBUG=true
    volumes:
      - ./data:/app/data
    depends_on:
      - minio
    networks:
      - incubrix-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incubrix-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - incubrix-net

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: incubrix-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - incubrix-net

  createbuckets:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: incubrix-createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set localminio http://minio:9000 minioadmin minioadmin;
      mc mb localminio/incubrix --ignore-existing;
      mc anonymous set download localminio/incubrix;
      exit 0;
      "
    networks:
      - incubrix-net

networks:
  incubrix-net:
    driver: bridge

volumes:
  minio-data:
